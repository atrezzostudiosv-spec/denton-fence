name: Denton Fence live Pages smoke QA
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/smoke-live.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-demo:
    name: Test live preview pages and assets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright and Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Validate deployed site at 375 / 768 / 1024 / 1440
        run: python scripts/smoke_live_pages.py
      - name: Archive smoke QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: denton-fence-live-smoke-qa
          path: qa-live-results.json
          if-no-files-found: warn
