name: QA — Denton Fence refinements
on:
  push:
    branches: [phase4-refinement-2026-10-28]
    paths:
      - '.github/workflows/qa-refinements.yml'
      - 'assets/**'
      - 'scripts/qa_refinements.py'
      - '**/index.html'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-regression:
    name: Test 15 pages, scroll and quote modal
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test browser
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Run responsive visual / interaction acceptance
        run: python scripts/qa_refinements.py
      - name: Store result even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: denton-fence-refinement-qa
          path: qa-refinement-results.json
          if-no-files-found: warn
